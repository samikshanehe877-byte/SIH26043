# Deployment for the FastAPI service, so every machine talks to one backend and sees the same
# problems. The Next.js frontend is deployed separately (Vercel) with NEXT_PUBLIC_API_URL pointing
# at this service's URL, set at build time -- Next.js inlines NEXT_PUBLIC_* during the build, so
# changing it afterwards does nothing until the frontend is rebuilt.
#
# There is deliberately no mounted disk. This file used to define one, back when problems lived in
# a SQLite file and evidence lived on the filesystem: without it every deploy started from an empty
# database and lost uploads. Both now live off the instance -- problem state in PostgreSQL
# (PROBLEM_DB_URL) and attachments in object storage (R2_*) -- so the instance holds nothing worth
# keeping and can be replaced freely. That is also what makes the free plan viable, since Render
# disks require a paid instance type.
services:
  - type: web
    name: samasyalink-api
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: free
    healthCheckPath: /health
    envVars:
      # The people directory. Keep channel_binding here: psycopg supports it, and it defends against
      # a man-in-the-middle even with a stolen certificate. Prisma cannot parse it, so the frontend's
      # copy of this URL must leave it off.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Exact frontend origins allowed to call this API from a browser, comma-separated and with no
      # wildcard: a wildcard combined with credentials is rejected by browsers and would expose the
      # API to any site. The frontend's URL does not exist until it is deployed, so this is normally
      # filled in on a second pass, once Vercel has issued one.
      - key: ALLOWED_ORIGINS
        sync: false
      # Problems, notifications, milestones and the points ledger. Point this at the same Postgres
      # database as DATABASE_URL; its tables live in their own schema so they cannot collide with
      # the Prisma tables, which define their own `problems` and `project_members`.
      #
      # Leaving it unset is not a viable deployment: the API would fall back to a SQLite file on an
      # instance with no persistent disk, and every deploy would silently start from nothing.
      - key: PROBLEM_DB_URL
        sync: false
      - key: PROBLEM_DB_SCHEMA
        value: ai
      # Object storage for evidence and workspace attachments. Without these the API writes uploads
      # to the container's own filesystem, which is discarded on every deploy and is not shared
      # between instances -- the failure mode being a database record that hands every viewer a link
      # to a file that exists nowhere. Keep the bucket private; the API streams files itself rather
      # than handing out public URLs, because these are citizens' evidence photographs.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
